name: Deploy to GitHub Pages

# The app is deliberately buildless: `public/` is the site. Every upstream it
# talks to (BRouter, OSRM, Open-Meteo, Overpass, Nominatim, OpenRouteService)
# sends permissive CORS headers, so the browser can reach them directly with no
# server of our own. Only shortened Google/Apple links need `npm start`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # `enablement` turns Pages on via the API if it is not already enabled,
      # so there is no manual visit to Settings → Pages after the first push.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
