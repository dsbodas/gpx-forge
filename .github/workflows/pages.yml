name: Deploy to GitHub Pages

# The app is deliberately buildless: `public/` is the site. Every upstream it
# talks to (BRouter, OSRM, Open-Meteo, Overpass, Nominatim, OpenRouteService)
# sends permissive CORS headers, so the browser reaches them directly and there
# is no backend to deploy. Only shortened Google/Apple links need `npm start`.
#
# This publishes `public/` to a `gh-pages` branch with plain git, rather than
# using the configure-pages/deploy-pages actions. Those need a Pages site that
# is already set to build from "GitHub Actions", plus OIDC id-token permission,
# and they fail the whole run when either is missing. Pushing a branch needs
# only `contents: write` and works on every account type.
#
# Repository setting this expects:
#   Settings → Pages → Build and deployment
#     Source: Deploy from a branch
#     Branch: gh-pages   /(root)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish public/ to the gh-pages branch
        run: |
          set -euo pipefail

          # Stop Pages running the site through Jekyll, which would ignore any
          # path beginning with an underscore.
          touch public/.nojekyll

          cd public
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA:0:7}"

          # Force-push: gh-pages is a generated artefact, not a history worth
          # preserving, and this keeps the branch from growing without bound.
          git push -f \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
