<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2530"/>
      <stop offset="1" stop-color="#0e131a"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f9e5f"/>
      <stop offset="0.45" stop-color="#e3c04a"/>
      <stop offset="0.72" stop-color="#e8590c"/>
      <stop offset="1" stop-color="#c02f2f"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- elevation profile fill -->
  <path d="M64 372 L150 300 L206 336 L288 176 L344 232 L448 128 L448 400 L64 400 Z"
        fill="url(#ridge)" opacity="0.28"/>
  <!-- profile ridge line -->
  <path d="M64 372 L150 300 L206 336 L288 176 L344 232 L448 128"
        fill="none" stroke="url(#ridge)" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- summit marker -->
  <circle cx="448" cy="128" r="30" fill="#0e131a"/>
  <circle cx="448" cy="128" r="19" fill="#e8590c"/>
  <!-- baseline -->
  <path d="M64 400 L448 400" stroke="#3a4756" stroke-width="12" stroke-linecap="round"/>
</svg>
